
data:
  unified_path: data/processed/unified.parquet
  cache_dir: data/processed/windows
  source_hz: 10.0
  target_hz: 2.0
  obs_seconds: 10.0
  pred_seconds: 30.0
  window_stride: 4
  min_mean_speed: 1.0
  val_fraction: 0.15
  test_fraction: 0.15
  split_seed: 1234
  max_vehicles: null

model:
  d_model: 128
  nhead: 8
  num_encoder_layers: 4
  num_decoder_layers: 4
  dim_feedforward: 512
  dropout: 0.1
  activation: gelu
  norm_first: true
  use_cv_prior: true
  output_scale: 10.0

train:
  batch_size: 128
  epochs: 20
  lr: 3.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 500
  grad_clip: 1.0
  loss: huber_position
  teacher_forcing: true
  num_workers: 2
  device: cuda
  amp: true
  seed: 42
  eval_every: 2
  early_stop_patience: 6
  out_dir: runs/p12_short

physics:
  weight: 0.0
