# NGSIM + both training-time features: IDM regulariser AND scheduled sampling.
# The fourth cell of the 2x2 factorial. IDM alone made things worse; this run
# exists to test whether that was an interaction with exposure bias rather
# than a property of the regulariser itself.
# Identical to ngsim_control.yaml except for the two scheduled-sampling
# keys, so the A/B isolates exposure bias and nothing else.
# Identical to phase1_baseline.yaml except for the runtime knobs: Colab gives
# ~2 CPU cores (so fewer dataloader workers) and a single GPU (so AMP is worth
# enabling). If no GPU is attached, src/train.py falls back to CPU with a
# warning rather than crashing.

data:
  unified_path: data/processed/ngsim.parquet
  cache_dir: data/processed/windows
  source_hz: 10.0
  target_hz: 2.0
  obs_seconds: 10.0
  pred_seconds: 30.0
  # Halved vs the synthetic configs: a 15-minute NGSIM slice yields ~950
  # usable vehicles against the simulator's 200, so denser striding keeps
  # the window count in the same ballpark.
  window_stride: 2
  min_mean_speed: 1.0
  val_fraction: 0.15
  test_fraction: 0.15
  split_seed: 1234
  max_vehicles: null

model:
  d_model: 128
  nhead: 8
  num_encoder_layers: 4
  num_decoder_layers: 4
  dim_feedforward: 512
  dropout: 0.1
  activation: gelu
  norm_first: true
  use_cv_prior: true
  output_scale: 10.0

train:
  batch_size: 128       # a T4 handles this comfortably at d_model=128
  epochs: 20
  lr: 3.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 500
  grad_clip: 1.0
  loss: huber_position    # huber_position | mse_position | ade
  teacher_forcing: true
  # Feed the decoder its own prediction with probability up to 0.25,
  # ramped in over the first 8 epochs. Higher values start to starve the
  # model of the correct signal; 0 reproduces the control exactly.
  scheduled_sampling: 0.25
  ss_ramp_epochs: 8
  num_workers: 2        # Colab VMs expose ~2 cores
  device: cuda
  amp: true
  seed: 42
  eval_every: 2
  early_stop_patience: 6
  out_dir: runs/ngsim_idm_ss

physics:
  # The only difference from the control run. Watch the two printed loss
  # components: if "IDM" dwarfs "data", lower this; if it stays near zero, the
  # regulariser is doing nothing and it should go up.
  # First attempt used weight 0.3 over the whole 30 s horizon and made ADE
  # 13% WORSE (4.98 -> 5.63). The IDM term plateaued at ~2.0, i.e. ~1.4 m/s^2
  # of disagreement -- the prescribed acceleration was simply wrong, because
  # the leader is assumed to hold its speed for the full 30 s. Restricting
  # the term to the first 5 s keeps it where that assumption is defensible,
  # and the lower weight stops it from dominating the data term.
  weight: 0.1
  horizon_steps: 10        # 5 s at 2 Hz
  # Generic literature values, deliberately NOT the simulator's
  # (a=1.4, b=2.0, s0=2.0, T=1.5), so the loss cannot just recover the
  # data-generating process.
  a_max: 1.2
  b_comf: 2.2
  s0: 2.5
  t_headway: 1.4
  delta: 4.0
  min_gap: 1.0
