# Phase 1 — Baseline Seq2Seq Transformer trajectory predictor.
# Every key here maps 1:1 onto a dataclass field in src/config.py; unknown keys
# raise at load time rather than being silently ignored.

data:
  unified_path: data/processed/unified.parquet
  cache_dir: data/processed/windows

  # NGSIM is 10 Hz, highD is 25 Hz. Both are resampled to target_hz during
  # preprocessing, so this value must match what you passed to
  # `python -m src.data.preprocess --target-hz`.
  source_hz: 10.0
  target_hz: 2.0        # -> 20 observed steps, 60 predicted steps

  obs_seconds: 10.0     # T_obs from the plan
  pred_seconds: 30.0    # T_pred from the plan
  window_stride: 4      # 2 s between consecutive windows at 2 Hz
  min_mean_speed: 1.0

  val_fraction: 0.15
  test_fraction: 0.15
  split_seed: 1234
  max_vehicles: null

model:
  d_model: 128
  nhead: 8
  num_encoder_layers: 4
  num_decoder_layers: 4
  dim_feedforward: 512
  dropout: 0.1
  activation: gelu
  norm_first: true
  use_cv_prior: true
  delta_scale: 3.0

train:
  batch_size: 64
  epochs: 60
  lr: 3.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 500
  grad_clip: 1.0
  loss: mse_position    # mse_delta | mse_position | huber_position
  teacher_forcing: true
  num_workers: 4
  device: cuda
  amp: true
  seed: 42
  eval_every: 1
  early_stop_patience: 12
  out_dir: runs/phase1_baseline
