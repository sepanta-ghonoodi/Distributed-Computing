<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Dashboard | Microservice Architecture</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      margin: 0;
      padding: 40px;
      display: flex;
      justify-content: center;
    }

    .dashboard-container {
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      padding: 30px 40px;
      width: 100%;
      max-width: 600px;
    }

    .header {
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 15px;
      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0;
      color: #2c3e50;
      font-size: 24px;
    }

    .user-info {
      background-color: #e8f4f8;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 25px;
      border-left: 5px solid #3498db;
    }

    .user-info p {
      margin: 8px 0;
      font-size: 15px;
    }

    .badge {
      background-color: #2ecc71;
      color: white;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
    }

    .file-section {
      background-color: #fcfcfc;
      border: 1px solid #e2e8f0;
      padding: 20px;
      border-radius: 8px;
    }

    .file-section h2 {
      margin-top: 0;
      font-size: 18px;
      color: #2c3e50;
    }

    .form-group {
      margin-bottom: 15px;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
      font-size: 14px;
    }

    button {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #2980b9;
    }

    .token-box {
      font-family: monospace;
      background: #2c3e50;
      color: #ecf0f1;
      padding: 5px 10px;
      border-radius: 4px;
      word-break: break-all;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="dashboard-container">
    <div class="header">
      <h1>Secure System Dashboard</h1>
    </div>

    <div class="user-info">
      <p><strong>Authenticated User:</strong> {{.Username}}</p>
      <p><strong>System Role:</strong> <span class="badge">{{.Role}}</span></p>
      <p><strong>Session Token:</strong></p>
      <div class="token-box">{{.Token}}</div>
    </div>

    <div class="file-section">
      <h2>Request Remote Asset</h2>
      <p style="font-size: 14px; color: #666;">Enter a filename to stream it securely from the VM3 File Server.</p>

      <form action="/download" method="POST">
        <div class="form-group">
          <input type="text" name="filename" placeholder="e.g., ut_logo.png or data.txt" required>
        </div>
        <button type="submit">Stream Download via gRPC</button>
      </form>
    </div>
  </div>

</body>

</html>
