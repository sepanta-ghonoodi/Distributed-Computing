syntax = "proto3";

package AuthService;

option go_package = "./pb/AuthService";

enum UserRole {
  UNDEFINED = 0;
  USER = 1;
}

message ReqAuth {
  string username = 1;
  string password = 2;
}

message ResAuth {
  string token = 1;
  UserRole role = 2;
}


service AuthSystem {
  rpc Login (ReqAuth) returns (ResAuth);
}